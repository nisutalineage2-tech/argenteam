# =================================================================
#                             Geodata
# =================================================================

# Specifies the path to geodata files. For example, when using geodata files located
# at different folder/harddrive ("C:/Program Files/Lineage II/system/geodata/"), default: ./data/geodata/
# Note: When L2OFF geodata are present in "Lineage II/system/geodata/" folder, the ingame client
# command ///geodata is enabled. This command allows player with admin rights to visually see geodata. 
GeoDataPath = ./data/geodata/

# Specifies the geodata files type. Default: L2OFF
# L2J: Using L2J geodata files (filename e.g. 22_16.l2j)
# L2OFF: Using L2OFF geodata files (filename e.g. 22_16_conv.dat)
# !!! CRITICAL: Set this to match your actual file extension.
#     If your files are *.l2j  -> GeoDataType = L2J
#     If your files are *_conv.dat -> GeoDataType = L2OFF
#     WRONG setting = server crashes on startup (System.exit(1)).
GeoDataType = L2OFF

# =================================================================
#                             Movement
# =================================================================

MaxGeopathFailCount = 50

# =================================================================
#                           Line of Sight
# =================================================================

PartOfCharacterHeight = 75
MaxObstacleHeight = 32

# =================================================================
#                           Pathfinding
# =================================================================

MoveWeight = 10
MoveWeightDiag = 14
ObstacleWeight = 30
HeuristicWeight = 12
MaxIterations = 10000

# =================================================================
#               Geodata files — OPTIMIZED (19 regions)
# =================================================================
#
# From ~85 regions down to 19. Only zones used by FactionWars,
# Events, and phantom starting towns. Everything else = null blocks
# (no collision/pathfinding, zero additional memory).
#
# The GeoEngine checks props.containsKey(rx+"_"+ry) for tiles 16-26
# in X and 10-25 in Y. Listed tiles → load geodata file.
# Non-listed tiles → shared _nullBlock singleton (1 object for ALL).
#
# Memory reduction: ~1.5 GB (85 regions) → ~350 MB (19 regions)
#
# Tile coordinate formula:
#   tileX = floor(worldX / 32768) + 20
#   tileY = floor(worldY / 32768) + 18
#
# Faction War Maps:
#   16_25 = Gludin center + evil spawn
#   17_25 = Neutral zone (Talking Island) + Gludin good spawn
#   18_22 = Abandoned Camp
#   19_21 = Gludio
#   19_22 = Ruins of Agony
#   20_22 = Dion
#   21_16 = Rune
#   22_13 = Schuttgart
#   22_19 = Oren
#   22_22 = Giran
#   24_16 = Goddard
#   24_19 = Aden
#   25_18 = Cemetery
#
# Event Zones:
#   17_22 = Lucky Chests (Event 7)
#
# Starting Towns (phantom spawns):
#   18_14 = Orc Village
#   20_18 = Dark Elf Village
#   21_19 = Elven Village + Newbie spawn
#   23_12 = Dwarf Village
#
# NOT enabled (null blocks = everything-allowed, fine for arena PvP):
#   18_15 = Coliseum (TvT, DM, CTF, etc.) — not supported by L2 client
# =================================================================

# Gludin
16_25

# Neutral zone (Talking Island) + Gludin good spawn
17_25

# Lucky Chests (Event 7)
17_22

# Coliseum (TvT, DM, CTF) — NOT SUPPORTED by L2 client, null blocks used
#18_15

# Orc Village
18_14

# Abandoned Camp
18_22

# Gludio
19_21

# Ruins
19_22

# Dark Elf Village
20_18

# Dion
20_22

# Rune
21_16

# Elven Village / Newbie spawn
21_19

# Schuttgart
22_13

# Oren
22_19

# Giran
22_22

# Dwarf Village
23_12

