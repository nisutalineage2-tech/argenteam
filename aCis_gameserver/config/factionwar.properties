# ================================================================
#              Faction War Event Configuration
# ================================================================

# Master toggle -- must be True for the entire faction system
EnableFactionSystem = True

# Faction War event enabled
Enabled = True

# Good/Evil mapped to faction.xml IDs
GoodFactionId = 1
EvilFactionId = 2

# Faction display names (used for UI messages and name colors)
GoodFactionName = Furious
EvilFactionName = Fast

# Faction name colors in RGB hex
GoodFactionColor = 0000E0
EvilFactionColor = F4FA58

# Score to win (used for scoreboard display only; the war is timed, winner is the faction holding the main flag)
ScoreToWin = 100

# End freeze duration in seconds — players are frozen before teleport to neutral zone
EndFreezeSeconds = 5

# Points per kill type
PointsPerFlagKill = 1
PointsPerPvpKill = 1

# Flag settings
FlagNpcId = 90000
FlagHp = 500000
FlagRespawnDelay = 30

# Guard settings
GuardNpcId = 90001
GuardHp = 100000
GuardPAtk = 500
GuardsPerBase = 3
GuardCircleRadius = 100
GuardRespawnDelay = 60

# War Registrar NPC (spawns always in neutral zone - Aden)
WarRegistrarNpcId = 90002

# Checkpoint settings (capturable battleground points near the main flag)
CheckpointNpcId = 90003
CheckpointCount = 3
CheckpointRadius = 400
# Respawn delay for a captured checkpoint (seconds)
CheckpointRespawnDelay = 15
# Score tick interval for owned checkpoints (seconds). 0 = disabled.
CheckpointScoreInterval = 30
# Points per owned checkpoint per tick
CheckpointPointsPerTick = 1

# Map rotation (minutes, 0=disabled, rotation uses voting)
MapRotationMinutes = 15
# Seconds to vote for next map
MapVoteSeconds = 30

# Maps: name,centerX,centerY,centerZ,radius,goodSpawnX,goodSpawnY,goodSpawnZ,evilSpawnX,evilSpawnY,evilSpawnZ
# IMPORTANT: All coordinates are verified to be OUTSIDE town PeaceZones so PvP works.
# Good/Evil spawns are on opposite sides of the map center (separated by semicolons)
Maps = Gludio,-18000,112000,-3600,3000,-19500,113500,-3600,-16500,110500,-3600;Dion,7000,136000,-3600,3000,5500,137500,-3600,8500,134500,-3600;Giran,75000,142000,-3400,3000,73500,143500,-3400,76500,140500,-3400;Oren,79000,48000,-1200,3000,77500,49500,-1200,80500,46500,-1200;Aden,150000,33000,-2200,3000,148500,34500,-2200,151500,31500,-2200;Goddard,145000,-48000,-2400,3000,143500,-46500,-2400,146500,-49500,-2400;Rune,50000,-48000,-800,3000,48500,-46500,-800,51500,-49500,-800;Schuttgart,83000,-138000,-1400,3000,81500,-136500,-1400,84500,-139500,-1400;Gludin,-100084,237987,-3563,3000,-97815,245147,-3726,-100162,230032,-3720;Ruins,-17260,143203,-3910,3000,-20398,136690,-3897,-25677,144904,-3476;Cemetery,175507,20533,-3253,3000,182888,20331,-3177,169812,20324,-3333;Abandoned,-52360,140376,-2928,3000,-54577,146821,-2880,-51552,134860,-2962

# Map flag IDs from faction_flags.xml: mapName,flagMapId (separated by semicolons)
# These link war maps to their flag sets defined in faction_flags.xml
# Example: Gludio uses mapId=2 in faction_flags.xml
MapFlagIds = Gludio,2;Giran,3;Gludin,1;Ruins,4;Cemetery,5;Abandoned,6;Dion,7;Oren,8;Aden,9;Goddard,10;Rune,11;Schuttgart,12

# Default fallback spawns (used when no per-map spawn is defined)
GoodSpawn = -84318,244579,-792
EvilSpawn = 82218,148561,-3472

# Neutral zone (Gludin Village) -- where the faction NPCs spawn, no PvP allowed
NeutralSpawnLoc = -82205,150869,-3120
NeutralZoneRadius = 3000

# Newbie spawn location (x,y,z) -- same as neutral zone
NewbieSpawnLoc = -82205,150869,-3120

# Announcements
AnnounceStart = True
AnnounceEnd = True
AnnounceFlagKill = True
AnnouncePvpKill = False
AnnounceScore = True
AnnounceMapSwitch = True

# Kill reward: points per cross-faction kill
KillRewardPoints = 1

# Town restriction: if True, faction players found near enemy base get teleported home on login
TownRestriction = True
TownRestrictionRadius = 1500

# ================================================================
#                    Rewards Configuration
# ================================================================

# Reward item ID (57 = Adena)
RewardItemId = 57
# Reward for #1 top player (amount of RewardItemId)
Top1Reward = 500000
# Reward for #2 top player
Top2Reward = 300000
# Reward for #3 top player
Top3Reward = 100000
# Reward for each member of the winning faction
WinningFactionReward = 50000

# PvP kill adena reward (amount given directly to the killer)
PvpAdenaReward = 5000

# Random spoil items dropped to party on PvP kill (itemId,count; separated by semicolons)
SpoilItems = 57,1000;5588,1;1875,1;1877,1;1879,1;1881,1

# War duration in minutes (the war ends when this timer expires; winner = faction holding the main flag)
# Set to 30 for quick tests, 120 for production
WarDurationMinutes = 30

# ================================================================
#                    Unstuck / Escape Configuration
# ================================================================

# Time in seconds for the /unstuck command to teleport to the neutral zone
# Only applies when FactionWar is enabled. Default: 10
UnstuckDelaySeconds = 10

# ================================================================
#              Faction Gameplay Settings
# ================================================================

# Starting level for new faction members
StartingLevel = 76
# Starting level for subclass after joining faction
StartingLevelSubClass = 76

# Adena price to change faction (0 = free)
PriceForFactionChange = 1000

# Auto-teleport all faction players back to base when the round ends
EnableAutoTeleportToBase = True

# Enable/disable faction guards spawn
EnableFactionGuards = True

# Auto-balance faction members by number when player logs in
EnablePlayersBalanceLogin = True

# Enable/disable map voting system. If disabled, the next map on the list is used.
EnableMapVoting = True

# ================================================================
#              Anti PvP Farm Protection
# ================================================================

# Block PvP rewards if target shares the same IP
EnableProtectionIP = True
# Block PvP rewards if target is in the same clan
EnableProtectionClan = False
# Block PvP rewards if target is in the same ally
EnableProtectionAlly = False
# Block PvP rewards if target's PDef is below threshold (prevents naked farming)
EnableProtectionArmour = True
ProtectionArmourAmount = 300
# Block PvP rewards if the same player was killed twice in a row by the same killer
EnableProtectionSamePlayer = False

# ================================================================
#              Class & Equipment Restrictions
# ================================================================

# Prevent support classes from stacking on one faction
EnableClassBalance = True

# Anti-heavy system: dagger/archer/fist classes cannot equip heavy armor
EnableAntiHeavySystem = True

# PvP kills required to use the special GM shop (id: 90) and equip S-grade items
KillsForSpecShop = 300
# Check PvP kills when equipping S-grade items
ForbidUseItem = True

# A-grade equipment limit based on PvP kills
EnableAGradeLimit = True
# PvP kills needed to equip A-grade items
KillsForAGradeItem = 100

# ================================================================
#              PvP Experience Rewards
# ================================================================

# Enable EXP reward on PvP kill
EnablePvpExpReward = True
# EXP reward based on killer level range: 75-76, 76-78, 78-80
PvpExpRewardFirst = 1000000
PvpExpRewardSecond = 2800000
PvpExpRewardThird = 120000

# ================================================================
#              PvP Item Rewards
# ================================================================

# Enable item reward on PvP kill
EnablePvpItemReward = True
# Item ID given on PvP kill
PvpItemRewardId = 57
# Item count = PvpItemRewardCount * factionFlagsOwned
PvpItemRewardCount = 2

# Party rewards: share item rewards with party members on PvP kill
EnablePartyPvpReward = True
# Only support classes in party get the reward
PartyRewardOnlySupportClass = False
# Chance (0-100) for party member to receive the reward
PartyRewardChance = 50
# Extra item count for the killer if they are in a party (ignored if box character detected)
KillerPartyBonus = 2

# ================================================================
#              Faction Points (persistent)
# ================================================================

# Points awarded for capturing/killing a flag
PointsRewardFlag = 2
# Points awarded for PvP kill
PointsRewardPvp = 3
# Lose points on death
LosePointsOnDeath = True
# Amount of points lost on death
PointsLoseAmount = 1

# ================================================================
#              Flag Capture Rewards (SP + Items)
# ================================================================

# Enable SP and item reward when capturing a flag
EnableFlagSpItemReward = True
# SP reward for capturing first flag (clan lvl 1-5 | lvl 5-7 | lvl 7-8 | no clan = third)
FlagSpRewardFirst = 157865
FlagSpRewardSecond = 100875
FlagSpRewardThird = 75405
# Item rewards for capturing a flag: itemId,count;itemId,count...
FlagItemReward1 = 57,6
FlagItemReward2 = 57,3
FlagItemReward3 = 57,2

# ================================================================
#              Castle Reward Multiplier
# ================================================================

# Increase PvP rewards if killer's clan owns a castle
EnableCastleRewardMultiplier = True
# Extra reward value if clan owns Aden castle
CastleRewardAden = 4
# Extra reward value if clan owns Dion castle
CastleRewardDion = 3
# Extra reward value if clan owns Gludio castle
CastleRewardGludio = 2

# ================================================================
#              Round End Rewards (Top Players)
# ================================================================

# SP reward for the best player of the round
RoundEndSpFirstPlace = 200000
# Adena reward for top 1/2/3
RoundEndAdenaFirstPlace = 60
RoundEndAdenaSecondPlace = 25
RoundEndAdenaThirdPlace = 10
# Enable ancient adena reward for first place
EnableRoundEndAaReward = True
RoundEndAaFirstPlace = 3
# Enable extra item reward for the top player only
EnableTopPlayerItemReward = True
TopPlayerItemRewardId = 5575
TopPlayerItemRewardAmount = 8
# Enable item reward for all members of the winning faction
EnableWinFactionItemReward = True
WinFactionItemRewardId = 5575
WinFactionItemRewardAmount = 5

# ================================================================
#              Enchant System
# ================================================================

# Enchant mode: PVPENCHANT (auto-enchant by kills), PVPSCROLLS (scrolls drop on PvP), OFF
EnchantMode = PVPSCROLLS
# Drop chance for enchant scrolls on PvP kill (0-100). Only used in PVPSCROLLS mode.
EnchantScrollDropChance = 34
# Max enchant level for items (PVPENCHANT mode)
MaxItemEnchant = 12
# Kills needed to auto-enchant B-grade (PVPENCHANT mode)
KillsForEnchantB = 25
# Kills needed to auto-enchant A-grade (PVPENCHANT mode)
KillsForEnchantA = 20
# Kills needed to auto-enchant S-grade (PVPENCHANT mode)
KillsForEnchantS = 40

# ================================================================
#              Class Balance Modifiers
# ================================================================

# Magic critical rate divisor (m.crit rate / ClassBalanceMcrit)
ClassBalanceMcrit = 1
# MATK multiplier (matk * ClassBalanceMAtk)
ClassBalanceMAtk = 0.8

# ================================================================
#              NPC/Player Say Texts (on faction change)
# ================================================================

# Enable NPC and player broadcast texts when choosing faction
EnableSayTexts = True
# Texts for Good faction NPC and the player who joins
GoodNpcText = Thanks for Register in Furious Team %n!
GoodPlayerText = I feel the power !!!
# Texts for Evil faction NPC and the player who joins
EvilNpcText = Thanks for Register in Fast Team %n!
EvilPlayerText = I feel the dark power !!

# ================================================================
#              Chaos Event
# ================================================================

# Enable/disable the Chaos Event (special timed event within faction war)
EnableChaosEvent = False
# Super Haste skill level given during Chaos Event (max 4)
ChaosSuperHasteLvl = 2
# Chaos Event duration in minutes
ChaosEventDuration = 20
# Chaos Event interval in minutes (time between events)
ChaosEventInterval = 360
# Reward item ID and amount for best PvP player in Chaos Event
