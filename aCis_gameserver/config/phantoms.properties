# ---------------------------------------------------------------------------
# 8. Muerte y respawn
# ---------------------------------------------------------------------------
RespawnInTown = True
RespawnDelayMs = 7000
ReturnToLevelZoneAfterDeath = False
ReturnToLevelZoneDelayMs = 12000

# ---------------------------------------------------------------------------
# 9. PVP defensivo
# ---------------------------------------------------------------------------
PvpEnabled = True
PvpRetaliationHits = 2
PvpHitMemoryMs = 15000
PvpResponseRange = 900
# True: los phantoms solo atacan personajes reales y phantoms de la faccion contraria.
# Desactiva el ataque a monstruos/NPCs (farmeo, guards, flags, checkpoints).
AttackOnlyEnemyFaction = True


# ---------------------------------------------------------------------------
# 9.b Defensa contra PK visibles
# ---------------------------------------------------------------------------
# Si ve un jugador con karma, lo prioriza antes que mobs normales.
AttackVisiblePk = True
VisiblePkRange = 1200
# ---------------------------------------------------------------------------
# 9.c Grand Boss Hunt (phantoms al evento de Grand Bosses)
# ---------------------------------------------------------------------------
# True: algunos phantoms viajan al lair del Grand Boss cuando esta online
# y lo atacan hasta que muera. Al morir el boss vuelven a la zona neutral.
BossHuntEnabled = True
# Maximo de phantoms que van a un mismo boss.
BossHuntMaxPerBoss = 4


# ---------------------------------------------------------------------------
# 10. PK rage controlado
# ---------------------------------------------------------------------------
PkEnabled = False
PkRagePercent = 1
PkSearchRange = 900
PkKarma = 720
PkAttackRealPlayers = True
PkRageTransfersOnDeath = True

# ---------------------------------------------------------------------------
# 11. Chat IA Gemini por whisper
# ---------------------------------------------------------------------------
