# ===========================================================================
# Phantom system for aCis
# Archivo principal de configuracion. True/False activa o desactiva funciones.
# Tiempos en milisegundos: 1000 = 1 segundo.
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. Lista y aparicion
# ---------------------------------------------------------------------------
# IDs guardados que carga //phantom_start. No borrar si queres conservarlos.
PhantomIds = 
# True: carga cerca del GM. False: usa ubicacion DB.
SpawnAtGm = False
# Guarda automaticamente phantoms creados.
PersistCreated = True
# Recuerda ultima ubicacion.
RememberLastLocation = False

# ---------------------------------------------------------------------------
# 2. IA basica
# ---------------------------------------------------------------------------
# La IA de los phantoms esta SIEMPRE activa por diseno; esta propiedad se ignora
# (el valor se fuerza a True en el codigo y el toggle IA on/off del panel de admin
# ya no puede pausarla). Se mantiene solo como documentacion.
AIEnabled = True
AITickMs = 3500
AggroRange = 900
WanderRange = 280

# ---------------------------------------------------------------------------
# 3. Patrulla y objetivos
# ---------------------------------------------------------------------------
PatrolEnabled = True
PatrolRadius = 900
PatrolWaypointReach = 140
AvoidClaimedTargets = True
TargetClaimMs = 12000


# ---------------------------------------------------------------------------
# 3.b Movimiento, geodata y anti-trabas
# ---------------------------------------------------------------------------
# Valida puntos de patrulla/wander contra la geodata antes de caminar.
UseGeoPathing = True
# Detecta si el phantom intenta moverse pero no avanza.
StuckCheckEnabled = True
# Distancia minima considerada avance real por tick de IA.
StuckCheckDistance = 40
# Cantidad de ticks trabado antes de intentar escapar.
StuckCheckTicks = 2
# Radio usado para buscar un punto cercano de escape.
StuckEscapeRadius = 450
StuckTeleportToFarmZone = False
StuckTeleportToSafeSpawn = True
StuckTeleportAttempts = 2
IdleStuckTicks = 6
# ---------------------------------------------------------------------------
# 4. Skills y mana
# ---------------------------------------------------------------------------
MageUseSkills = True
MageSkillChance = 85
MinMageMpPercent = 15
FighterUseSkills = False
# Permite que todos los phantoms usen skills ofensivas.
AdvancedSkillUsage = True
# Chance general para clases no magas.
SkillChance = 70
# Si True, magos sin MP no pegan con arma; esperan MP/herbs.
MageNeverMelee = True
# MP minimo para que un mago salga del descanso.
MageRestMpPercent = 35


# ---------------------------------------------------------------------------
# 4.b Progresion automatica
# ---------------------------------------------------------------------------
# Aprende skills aunque el servidor no tenga AutoLearnSkills activado.
AutoSkillEnabled = True
# Cambia de clase siguiendo la rama original del personaje.
AutoClassEnabled = True
AutoFirstClassLevel = 20
AutoSecondClassLevel = 40
# Tercera clase en Interlude puede saltear quests; por defecto apagado.
AutoThirdClassEnabled = False
AutoThirdClassLevel = 76
# ---------------------------------------------------------------------------
# 5. Equipo automatico
# ---------------------------------------------------------------------------
AutoEquip = True
AutoEquipRefresh = False
EquipmentIncompleteChance = 22
EquipmentMixedChance = 28
# Grado de equipo: A = solo grado A, S = solo grado S, AS = A o S aleatorio.
EquipmentGrade = AS
AutoBuff = True
AutoBuffIntervalMs = 3600000

# ---------------------------------------------------------------------------
# 6. Loot, herbs e inventario
# ---------------------------------------------------------------------------
AutoLootDrops = True
AutoLootRange = 900
# True: cada phantom solo busca drops/herbs propios. Evita que todos corran al mismo item.
LootOwnDropsOnly = True
# Radio cerca del ultimo mob atacado para tomar drops sin proteccion.
LootOwnDropRadius = 350
# Tiempo que recuerda el ultimo mob para loot sin proteccion.
LootOwnDropMemoryMs = 20000
# Reserva temporal de un item para que no lo persigan varios phantoms.
LootClaimMs = 10000
# Levanta herbs aunque AutoLootDrops este apagado.
AutoLootHerbs = True
AutoLootHerbRange = 900
# IDs extra considerados herbs. Vacio = tambien detecta por nombre Herb.
HerbItemIds = 
AutoCleanupInventory = True
CleanupInventoryLoadPercent = 40
CleanupIntervalTicks = 8
CleanupAllNonEquipable = False
