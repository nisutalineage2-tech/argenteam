# ---------------------------------------------------------------------------
# 11.b Chat social casual
# ---------------------------------------------------------------------------
SocialChatEnabled = True
SocialChatChance = 8
SocialChatRange = 1200
SocialChatMinDelayMs = 90000
SocialChatMaxDelayMs = 240000
# ---------------------------------------------------------------------------
# 12. Log dedicado
# ---------------------------------------------------------------------------
# Se pisa al iniciar el servidor. Activar backup si queres conservar anterior.
PhantomLogEnabled = True
PhantomLogFile = ./log/phantoms.log
PhantomLogBackupOnStartup = False

# ---------------------------------------------------------------------------
# 13. Tienda offline (vendedores en zona neutral)
# ---------------------------------------------------------------------------
# Los phantoms en zona neutral se sientan y abren una tienda real de venta
# con items de verdad, simulando jugadores con la tienda abierta.
StoreEnabled = True
# Probabilidad (0-100) por tick de abrir tienda en zona neutral.
StoreChance = 30
# Items que vende (ids separados por coma). Usar items tradables normales.
StoreItemIds = 1835,1836,1837,2509,2510,2511,1061,1062,1064,1073,736
# Cantidad de items distintos que lista (min/max).
StoreItemListMin = 2
StoreItemListMax = 5
# Cantidad de unidades por item (min/max).
StoreItemCountMin = 10
StoreItemCountMax = 50
# Multiplicador de precio sobre el precio de referencia del item (1.0 = precio base).
StorePriceMultiplier = 1.0
# Titulo que muestra la tienda.
StoreTitle = Vendo barato
# Duracion de la tienda abierta (ms) antes de cerrarse y seguir con la IA.
StoreDurationMinMs = 60000
StoreDurationMaxMs = 180000

# ---------------------------------------------------------------------------
# 13.b Interaccion con NPCs de ciudad
# ---------------------------------------------------------------------------
# Los phantoms ociosos en ciudad buscan un NPC conocido (vendedor, banquero,
# gatekeeper, NPCs de faccion/eventos) y emulan interactuar con el: caminan
# hacia el, lo miran y se quedan unos segundos como si hablaran. Puramente
# cosmetico, no abre dialogos ni dispara scripts del NPC.
NpcInteractionEnabled = True
# Probabilidad (0-100) por tick ocioso de iniciar una interaccion.
NpcInteractionChance = 30

# ---------------------------------------------------------------------------
# 14. Participacion en FactionWars
# ---------------------------------------------------------------------------
# Controla cuantos phantoms participan de la FactionWars para no vaciar las
# ciudades durante la guerra. Los que no participan se quedan en su zona
# neutral/ciudad con su comportamiento normal (tienda, wander, farm).

# Porcentaje (0-100) de phantoms con faccion que participan de la guerra.
# 100 = todos participan (comportamiento original).
WarParticipationChance = 100

# Maximo de phantoms por faccion que participan. 0 = sin limite.
# Ej: 5 = solo 5 phantoms de cada faccion van a la guerra.
WarMaxPerFaction = 0

# Si es > 0, solo participan los phantoms dentro de esta distancia (units)
# de la zona neutral (los que estan cerca simulan viajar a la guerra).
# 0 = todos los phantoms elegibles, sin importar donde esten.
WarNearbyOnlyRange = 0
WarRespawnDelayMs = 12000
WarRespawnRandomMs = 8000
