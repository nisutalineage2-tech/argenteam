<html><title>Event Manager</title><body>
<table width=290>
	<tr>
		<td width="290" height="28" align="center"><font color=LEVEL>Event Manager</font></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="290" height="1">
<table width=290 height=40>
	<tr>
		<td width="290"><font color=FF8800>Welcome! Select an event below:</font></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="290" height="1">
<table width=290 height=40>
	<tr>
		<td width="200">TvT - Team vs Team<br1><font color="808080">Capture the enemy base!</font></td>
		<td width="90"><button value="Info" action="bypass -h npc_%objectId%_event_info 1" width="50" height="22" back="L2UI_CH3.Minimap.mapbutton_zoomin1_over" fore="L2UI_CH3.Minimap.mapbutton_zoomin1"></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="290" height="1">
<table width=290 height=40>
	<tr>
		<td width="200">DM - Deathmatch<br1><font color="808080">Free for all battle!</font></td>
		<td width="90"><button value="Info" action="bypass -h npc_%objectId%_event_info 2" width="50" height="22" back="L2UI_CH3.Minimap.mapbutton_zoomin1_over" fore="L2UI_CH3.Minimap.mapbutton_zoomin1"></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="290" height="1">
<table width=290 height=40>
	<tr>
		<td width="200">CTF - Capture the Flag<br1><font color="808080">Steal the enemy flag!</font></td>
		<td width="90"><button value="Info" action="bypass -h npc_%objectId%_event_info 3" width="50" height="22" back="L2UI_CH3.Minimap.mapbutton_zoomin1_over" fore="L2UI_CH3.Minimap.mapbutton_zoomin1"></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="290" height="1">
<table width=290 height=40 bgcolor="000000">
	<tr>
		<td width="230"><font color=FF6666>Leave current event</font></td>
		<td width="60"><button value="Leave" action="bypass -h npc_%objectId%_event_leave" width="50" height="22" back="L2UI_CH3.Minimap.mapbutton_zoomin1_over" fore="L2UI_CH3.Minimap.mapbutton_zoomin1"></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="290" height="1">
<table width=290>
	<tr>
		<td width="290" height="20"><font color="808080">Tip: Use .eventjoin &lt;id&gt; to join quickly!</font></td>
	</tr>
</table>
</body></html>
