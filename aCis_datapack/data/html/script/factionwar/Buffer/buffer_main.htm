<html><body>
<center><font color="LEVEL">Faction Buffer</font><br1>
<font color="FFD700">Free Buffs for Faction Members</font></center>
<br>
%MESSAGE%
<br>
¡Bienvenido! Soy el buffer de la facción. Puedo darte todos los buffs que necesites para la batalla.<br>
Elige un paquete o selecciona buffs individuales.<br>
<br>
<center>
<table width="280">
<tr>
<td>
<button value="⚔️ Paquete Físico" action="bypass -h npc_%objectId%_bufferBuff 1" width="230" height="25" back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
</td>
</tr>
<tr>
<td>
<button value="🔮 Paquete Mágico" action="bypass -h npc_%objectId%_bufferBuff 2" width="230" height="25" back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
</td>
</tr>
<tr>
<td>
<button value="🏆 Paquete Completo" action="bypass -h npc_%objectId%_bufferBuff 3" width="230" height="25" back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
</td>
</tr>
<tr>
<td>
<button value="📋 Buffs Individuales" action="bypass -h npc_%objectId%_bufferPage 1" width="230" height="25" back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
</td>
</tr>
</table>
<br>
<img src="L2UI.SquareGray" width="270" height="1">
<br>
<font color="808080">Los buffs duran hasta que mueras o salgas del juego.</font>
</center>
</body></html>
